services:
  - type: web
    name: sentrynode-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DEMOMODE
        value: "true"
      - key: AGENT_TOKEN
        sync: false
      - key: ALERT_DB_PATH
        value: /tmp/alerts.sqlite3
      - key: CORSORIGINS
        value: ""
      - key: ABUSEIPDBAPIKEY
        sync: false
      - key: JWTSECRET
        generateValue: true
