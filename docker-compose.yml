services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentrynode-backend
    environment:
      PYTHONUNBUFFERED: "1"
      LOGLEVEL: ${LOGLEVEL:-INFO}
      ABUSEIPDBAPIKEY: ${ABUSEIPDBAPIKEY:-change-me}
      DISCORDWEBHOOKURL: ${DISCORDWEBHOOKURL:-}
      JWTSECRET: ${JWTSECRET:-change-me}
      AGENT_TOKEN: ${AGENT_TOKEN:?Set AGENT_TOKEN in .env}
      ALERT_DB_PATH: /tmp/alerts.sqlite3
      REDISHOST: redis
      REDISPORT: "6379"
      REDISDB: "0"
      REDISTTLSECONDS: "3600"
      DEMOMODE: ${DEMOMODE:-false}
      CORSORIGINS: ${CORSORIGINS:-}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - alert-data:/tmp
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks: [sentrynode-net]

  redis:
    image: redis:7-alpine
    container_name: sentrynode-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [sentrynode-net]

volumes:
  alert-data:
  redis-data:

networks:
  sentrynode-net:
    driver: bridge
